<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S — Personal Command Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05070c;
  --bg-elev: rgba(13, 18, 30, 0.72);
  --surface: rgba(17, 24, 39, 0.78);
  --surface-hi: rgba(26, 36, 56, 0.92);
  --border: rgba(148, 163, 184, 0.14);
  --border-hi: rgba(56, 189, 248, 0.42);
  --cyan: #38bdf8;
  --cyan-glow: rgba(56, 189, 248, 0.35);
  --indigo: #6366f1;
  --danger: #f43f5e;
  --danger-bg: rgba(244, 63, 94, 0.15);
  --danger-border: rgba(244, 63, 94, 0.48);
  --ok: #34d399;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --dim: #64748b;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg);
  color: var(--text);
  font: 400 14.5px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 75% 45% at 50% -10%, rgba(56, 189, 248, 0.16), transparent 65%),
    radial-gradient(ellipse 50% 40% at 85% 100%, rgba(99, 102, 241, 0.12), transparent 65%),
    linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Top Navigation Bar */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 14px;
  background: rgba(5, 7, 12, 0.72);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.brand-wrap { display: flex; align-items: center; gap: 11px; }
.brand-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(56, 189, 248, 0.4);
}
.brand {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--dim);
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
}
#conn i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
  transition: background 0.2s, box-shadow 0.2s;
}
#conn.online i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
#conn.online { color: var(--text); border-color: rgba(52, 211, 153, 0.28); }

.ghost {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 5px 11px;
  font-size: 12.5px;
  color: var(--muted);
  transition: all 0.18s ease;
}
.ghost:hover { color: var(--text); border-color: var(--border-hi); background: var(--surface-hi); }

.stop-top {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 10px;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  color: #fda4af;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.18s ease;
}
.stop-top:hover:not(:disabled) {
  background: var(--danger);
  color: #fff;
  box-shadow: 0 0 18px rgba(244, 63, 94, 0.45);
}
.stop-top:disabled {
  opacity: 0.35;
  cursor: default;
  border-color: var(--border);
  background: transparent;
  color: var(--dim);
}
.stop-top svg { width: 13px; height: 13px; fill: currentColor; }

/* Arc-Reactor Orb Stage */
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 26px 20px 8px;
  transition: all 0.35s ease;
}
.reactor-wrap {
  position: relative;
  display: grid;
  place-items: center;
  width: 148px;
  height: 148px;
  transition: width 0.35s ease, height 0.35s ease;
}
.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(56, 189, 248, 0.22);
  pointer-events: none;
}
.ring.r1 {
  inset: 0;
  border-top-color: var(--cyan);
  border-right-color: transparent;
  animation: spin 12s linear infinite;
}
.ring.r2 {
  inset: 10px;
  border-style: dashed;
  border-color: rgba(99, 102, 241, 0.32);
  animation: spinRev 18s linear infinite;
}
.orb {
  position: relative;
  width: 104px;
  height: 104px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background:
    radial-gradient(circle at 32% 28%, rgba(186, 230, 253, 0.88), rgba(56, 189, 248, 0.38) 38%, rgba(30, 41, 59, 0.88) 78%),
    radial-gradient(circle at 70% 75%, rgba(99, 102, 241, 0.55), transparent 60%);
  box-shadow:
    inset 0 2px 12px rgba(255, 255, 255, 0.45),
    0 0 38px rgba(56, 189, 248, 0.36),
    0 14px 40px rgba(0, 0, 0, 0.55);
  display: grid;
  place-items: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease, width 0.35s ease, height 0.35s ease;
}
.orb:hover { transform: scale(1.04); box-shadow: inset 0 2px 14px rgba(255, 255, 255, 0.55), 0 0 52px rgba(56, 189, 248, 0.55); }
.orb-bars { display: flex; align-items: center; gap: 4px; height: 28px; }
.orb-bars i {
  display: block; width: 3.5px; height: 7px; border-radius: 99px;
  background: #fff;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  transition: height 0.2s;
}
.orb-bars i:nth-child(2) { animation-delay: -0.15s; }
.orb-bars i:nth-child(3) { animation-delay: -0.3s; }
.orb-bars i:nth-child(4) { animation-delay: -0.45s; }
.orb-bars i:nth-child(5) { animation-delay: -0.6s; }

/* Orb States */
.orb[data-state="listening"] .orb-bars i { height: 11px; }
.orb[data-state="awake"] .orb-bars i,
.orb[data-state="speaking"] .orb-bars i { animation: wave 0.85s ease-in-out infinite; }
.orb[data-state="thinking"] {
  background:
    radial-gradient(circle at 35% 30%, rgba(196, 181, 253, 0.9), rgba(99, 102, 241, 0.5) 42%, rgba(15, 23, 42, 0.9) 80%);
  box-shadow: 0 0 48px rgba(99, 102, 241, 0.65);
}
.orb[data-state="thinking"] ~ .r1 { animation-duration: 2.2s; border-top-color: #a5b4fc; }
.orb[data-state="thinking"] .orb-bars i { animation: wave 0.55s ease-in-out infinite; }

/* Compact header stage once messages exist */
.has-msgs .stage {
  flex-direction: row;
  justify-content: center;
  gap: 14px;
  padding: 10px 20px 6px;
}
.has-msgs .reactor-wrap { width: 58px; height: 58px; }
.has-msgs .ring.r2 { inset: 5px; }
.has-msgs .orb { width: 42px; height: 42px; }
.has-msgs .orb-bars { height: 15px; gap: 2.5px; }
.has-msgs .orb-bars i { width: 2.5px; height: 4px; }
.has-msgs .orb[data-state="awake"] .orb-bars i,
.has-msgs .orb[data-state="speaking"] .orb-bars i,
.has-msgs .orb[data-state="thinking"] .orb-bars i { animation-name: waveSmall; }

.txt { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.has-msgs .txt { align-items: flex-start; }
#status {
  margin: 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.heard {
  margin: 0;
  max-width: min(56ch, 88vw);
  min-height: 1.3em;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--cyan);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Active Task Banner with Abort button */
.task-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: min(740px, calc(100% - 32px));
  margin: 4px auto 0;
  padding: 9px 14px;
  border-radius: 12px;
  background: rgba(244, 63, 94, 0.08);
  border: 1px solid rgba(244, 63, 94, 0.34);
  backdrop-filter: blur(12px);
}
.task-banner.show { display: flex; }
.task-info {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  font-size: 13px;
  color: var(--text);
}
.pulse-dot {
  flex: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: pulse 1.2s ease-in-out infinite;
}
.task-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-timer { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; }
.abort-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid var(--danger-border);
  background: var(--danger);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  transition: transform 0.12s ease, filter 0.15s ease;
}
.abort-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* Conversation Log */
.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding: 12px 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
  scrollbar-color: rgba(148, 163, 184, 0.2) transparent;
}
.empty { margin: auto; width: 100%; text-align: center; padding: 6px 0; }
.empty h2 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #ffffff 30%, #7dd3fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.empty p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

.sug {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  max-width: 580px;
  margin: 0 auto;
  text-align: left;
}
.sug button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px 15px;
  backdrop-filter: blur(12px);
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.sug button:hover {
  transform: translateY(-2px);
  border-color: var(--border-hi);
  background: var(--surface-hi);
}
.sug b { display: block; font-weight: 600; font-size: 13.5px; color: var(--text); margin-bottom: 2px; }
.sug span { font-size: 12.5px; color: var(--muted); }

.msg { max-width: 68ch; overflow-wrap: anywhere; animation: fadeUp 0.22s ease; }
.msg.you {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.2));
  border: 1px solid rgba(56, 189, 248, 0.34);
  border-radius: 16px 16px 4px 16px;
  padding: 9px 15px;
  color: #fff;
}
.msg.jarvis {
  align-self: flex-start;
  display: flex;
  gap: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px;
  padding: 10px 15px;
  backdrop-filter: blur(12px);
}
.msg.jarvis::before {
  content: "";
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #bae6fd, #38bdf8 50%, #4f46e5);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
}
.msg.cancelled {
  align-self: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #fda4af;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  border-radius: 999px;
  padding: 4px 14px;
}
.msg.error {
  align-self: center;
  color: #fda4af;
  font-size: 13px;
  text-align: center;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  border-radius: 10px;
  padding: 7px 14px;
}

.typing span {
  display: inline-block;
  width: 6px; height: 6px;
  margin: 8px 2px 0;
  border-radius: 50%;
  background: var(--cyan);
  animation: dot 1.1s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

/* Bottom Composer Dock */
.dock {
  padding: 10px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 780px;
  margin: 0 auto;
  padding: 7px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  backdrop-filter: blur(18px);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.bar:focus-within {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16), 0 14px 36px rgba(0, 0, 0, 0.5);
}
#text {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 8px 6px;
  font-size: 14.5px;
}
#text::placeholder { color: var(--dim); }

.icon, .send, .stop-inline {
  flex: none;
  height: 38px;
  border-radius: 12px;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.16s ease;
}
.icon { width: 38px; background: transparent; color: var(--muted); }
.icon:hover { background: var(--surface-hi); color: var(--text); }
.icon.on { background: rgba(56, 189, 248, 0.22); color: var(--cyan); box-shadow: 0 0 14px rgba(56, 189, 248, 0.28); }
.send { width: 38px; background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; }
.send:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
.send:disabled { opacity: 0.28; cursor: default; }

.stop-inline {
  display: none;
  gap: 6px;
  padding: 0 13px;
  background: var(--danger);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}
.stop-inline.show { display: inline-flex; }
.stop-inline:hover { filter: brightness(1.1); }

.icon svg, .send svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
.stop-inline svg { width: 13px; height: 13px; fill: currentColor; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinRev { to { transform: rotate(-360deg); } }
@keyframes wave { 0%, 100% { height: 7px; } 50% { height: 24px; } }
@keyframes waveSmall { 0%, 100% { height: 4px; } 50% { height: 14px; } }
@keyframes dot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); } 40% { opacity: 1; transform: scale(1.1); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
  .top { padding-left: 14px; padding-right: 14px; }
  .brand-sub { display: none; }
  .sug { grid-template-columns: 1fr; }
  .empty h2 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand-wrap">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1 class="brand">J.A.R.V.I.S</h1>
    <span class="brand-sub">LOCAL HUD</span>
  </div>
  <div class="tools">
    <span class="pill" id="conn"><i></i><span id="connTxt">Connecting</span></span>
    <button class="stop-top" id="stopTop" type="button" disabled title="Cancel current task (Esc)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
      <span>Stop Task</span>
    </button>
    <button class="ghost" id="aiMode" type="button" title="Switch between Auto (Ollama -> Gemini), Ollama Local, and Gemini Cloud">AI: Auto</button>
    <button class="ghost" id="micMode" type="button">Mic: browser</button>
    <button class="ghost" id="mute" type="button">Sound on</button>
    <button class="ghost" id="clear" type="button">Clear</button>
  </div>
</header>

<section class="stage">
  <div class="reactor-wrap">
    <button class="orb" id="orb" data-state="idle" type="button" aria-label="Start or stop voice listening">
      <span class="orb-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </button>
    <span class="ring r1" aria-hidden="true"></span>
    <span class="ring r2" aria-hidden="true"></span>
  </div>
  <div class="txt">
    <p id="status">Tap the core to start listening</p>
    <p class="heard" id="heard"></p>
  </div>
</section>

<div class="task-banner" id="taskBanner" role="status" aria-live="polite">
  <div class="task-info">
    <span class="pulse-dot"></span>
    <span class="task-label" id="taskLabel">Running task…</span>
    <span class="task-timer" id="taskTimer">0.0s</span>
  </div>
  <button class="abort-btn" id="abortBanner" type="button">Stop Task</button>
</div>

<section class="log" id="log" aria-live="polite"></section>

<footer class="dock">
  <form class="bar" id="form" autocomplete="off">
    <button class="icon" id="micBtn" type="button" aria-label="Toggle voice listening">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <input id="text" type="text" placeholder="Ask Jarvis anything or issue a command… (Esc stops active task)" aria-label="Command input">
    <button class="stop-inline" id="stopInline" type="button" aria-label="Stop current task">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
      <span>Stop</span>
    </button>
    <button class="send" id="go" type="submit" aria-label="Send command" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</footer>

<template id="emptyTpl">
  <div class="empty" id="empty">
    <h2>At your service, Sir.</h2>
    <p>Tap the reactor and say “Jarvis”, press Space for push-to-talk, or type a command below. Press Esc anytime to cancel a running task.</p>
    <div class="sug">
      <button type="button" data-send="open spotify"><b>Open Spotify</b><span>Launches your Spotify desktop app</span></button>
      <button type="button" data-fill="play  in spotify"><b>Play on Spotify</b><span>Searches &amp; plays directly in Spotify</span></button>
      <button type="button" data-send="what is the time and date"><b>Time &amp; Date</b><span>Instant local date and time check</span></button>
      <button type="button" data-send="open youtube"><b>Open YouTube</b><span>Opens YouTube in your browser</span></button>
    </div>
  </div>
</template>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var orb = $('orb'), statusEl = $('status'), heardEl = $('heard'), log = $('log');
  var input = $('text'), go = $('go'), micBtn = $('micBtn');
  var stopTop = $('stopTop'), stopInline = $('stopInline'), taskBanner = $('taskBanner');
  var taskLabel = $('taskLabel'), taskTimer = $('taskTimer'), abortBanner = $('abortBanner');

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, awaiting = false, awaitTimer = null, heardTimer = null, sayId = 0;
  var speaking = false, busy = false, muted = false, offline = false;
  var useServer = false, srvActive = false, epoch = 0;
  var currentAbort = null, currentTyping = null, timerInt = null, taskStart = 0;

  try { useServer = localStorage.getItem('jarvis-mic') === 'server'; } catch(_){}
  var WAKE = /(jarvis|jarvas|jervis|jarves|charvis|jarvice|gervais|travis|jarvi)/i;

  function setState(s, msg){ orb.dataset.state = s; if(msg) statusEl.textContent = msg; }
  function updateStopControls(){
    var active = busy || speaking;
    stopTop.disabled = !active;
    stopInline.classList.toggle('show', active);
    go.style.display = active ? 'none' : 'inline-flex';
    taskBanner.classList.toggle('show', active);
  }
  function startTimer(label){
    taskStart = performance.now();
    taskLabel.textContent = label;
    taskTimer.textContent = '0.0s';
    clearInterval(timerInt);
    timerInt = setInterval(function(){
      taskTimer.textContent = ((performance.now() - taskStart) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopTimer(){
    clearInterval(timerInt);
    timerInt = null;
  }

  function idle(){
    micBtn.classList.toggle('on', listening);
    updateStopControls();
    if(offline) return setState('idle', 'Jarvis shut down. Send any command to wake it.');
    if(!listening) return setState('idle', 'Tap the core to start listening');
    if(awaiting) return setState('awake', 'I’m listening, Sir…');
    setState('listening', 'Say “Jarvis” (or press Space) to wake me');
  }

  function showHeard(t, isFinal){
    heardEl.textContent = t ? ('Heard: “' + t + '”') : '';
    clearTimeout(heardTimer);
    if(isFinal) heardTimer = setTimeout(function(){ heardEl.textContent = ''; }, 4000);
  }

  function showEmpty(){
    document.body.classList.remove('has-msgs');
    log.innerHTML = '';
    log.appendChild($('emptyTpl').content.cloneNode(true));
  }
  function addMsg(who, text){
    var e = $('empty'); if(e) e.remove();
    document.body.classList.add('has-msgs');
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    if(who === 'jarvis'){
      var p = document.createElement('div');
      p.textContent = text;
      d.appendChild(p);
    } else {
      d.textContent = text;
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function addTyping(){
    var d = document.createElement('div');
    d.className = 'msg jarvis typing';
    d.innerHTML = '<div><span></span><span></span><span></span></div>';
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  /* Stop / Cancel Active Task */
  function cancelActiveTask(){
    if(!busy && !speaking) return;
    if(currentAbort){ try { currentAbort.abort(); } catch(_){} currentAbort = null; }
    if('speechSynthesis' in window){ try { speechSynthesis.cancel(); } catch(_){} }
    sayId++;
    speaking = false;
    busy = false;
    if(currentTyping){ currentTyping.remove(); currentTyping = null; }
    stopTimer();
    fetch('/api/stop', { method: 'POST' }).catch(function(){});
    addMsg('cancelled', 'Task cancelled, Sir.');
    idle();
    resumeRec();
  }

  /* Speaking */
  function say(text){
    return new Promise(function(done){
      if(muted || !('speechSynthesis' in window) || !text){ done(); return; }
      var id = ++sayId, finished = false, guard;
      function end(){
        if(finished) return;
        finished = true;
        clearTimeout(guard);
        if(id === sayId){ speaking = false; stopTimer(); resumeRec(); idle(); }
        done();
      }
      try {
        if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; u.rate = 1.04;
        u.onend = end; u.onerror = end;
        speaking = true;
        pauseRec();
        startTimer('Speaking response…');
        updateStopControls();
        setState('speaking', 'Speaking…');
        guard = setTimeout(end, Math.max(4000, text.length * 95));
        speechSynthesis.speak(u);
      } catch(_){ end(); }
    });
  }

  /* Listening */
  function pauseRec(){
    if(useServer){ epoch++; return; }
    if(rec && listening){ try { rec.stop(); } catch(_){} }
  }
  function resumeRec(){
    if(!listening) return;
    if(useServer){ serverLoop(); return; }
    if(rec){ try { rec.start(); } catch(_){} }
  }
  function serverLoop(){
    if(!listening || !useServer || srvActive || speaking || busy) return;
    srvActive = true; var my = epoch;
    fetch('/api/listen', { method: 'POST' })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(x){
        srvActive = false;
        if(!x.ok){
          listening = false; awaiting = false; idle();
          statusEl.textContent = x.d.error || 'The computer’s microphone failed.';
          return;
        }
        if(listening && my === epoch && x.d.text){ showHeard(x.d.text, true); heard(x.d.text); }
      })
      .catch(function(){
        srvActive = false; listening = false; awaiting = false; idle();
        statusEl.textContent = 'Can’t reach Jarvis server. Check that server.py is running.';
      })
      .then(function(){ if(listening) setTimeout(serverLoop, 60); });
  }
  function updateMicLabel(){ $('micMode').textContent = useServer ? 'Mic: computer' : 'Mic: browser'; }
  function switchToServer(){
    useServer = true; try { localStorage.setItem('jarvis-mic', 'server'); } catch(_){}
    updateMicLabel();
    try { rec && rec.stop(); } catch(_){}
    idle();
    statusEl.textContent = 'Using this computer’s microphone.';
    serverLoop();
  }
  function startListening(){
    if(useServer){ listening = true; idle(); serverLoop(); return; }
    if(!SR){ setState('idle', 'Voice input needs Chrome or Edge. Typing still works.'); return; }
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e){
      var interim = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        var t = e.results[i][0].transcript.trim();
        if(e.results[i].isFinal){ showHeard(t, true); heard(t); }
        else interim += t + ' ';
      }
      if(interim) showHeard(interim.trim(), false);
    };
    rec.onend = function(){
      if(listening && !speaking && !useServer) setTimeout(function(){ if(listening && !speaking && !useServer){ try { rec.start(); } catch(_){} } }, 250);
    };
    rec.onerror = function(e){
      var msg = null;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = 'Microphone blocked. Allow it in the address bar.';
      else if(e.error === 'network'){ switchToServer(); return; }
      else if(e.error === 'audio-capture') msg = 'No microphone detected.';
      if(msg){ listening = false; awaiting = false; idle(); statusEl.textContent = msg; }
    };
    listening = true;
    try { rec.start(); } catch(_){}
    idle();
  }
  function stopListening(){
    epoch++; listening = false; awaiting = false; clearTimeout(awaitTimer);
    try { rec && rec.stop(); } catch(_){}
    showHeard('');
    idle();
  }
  function toggleListening(){ listening ? stopListening() : startListening(); }
  function armCommand(){
    awaiting = true; clearTimeout(awaitTimer);
    setState('awake', 'I’m listening, Sir…');
    awaitTimer = setTimeout(function(){ awaiting = false; idle(); }, 12000);
  }
  function talkNow(){
    if(!SR && !useServer){ setState('idle', 'Voice input needs Chrome or Edge.'); return; }
    if(!listening) startListening();
    if(listening) armCommand();
  }
  function heard(text){
    if(!text || busy || speaking) return;
    if(awaiting){ awaiting = false; clearTimeout(awaitTimer); return send(text); }
    var m = text.match(WAKE); if(!m) return;
    var rest = text.slice(m.index + m[0].length).replace(/^[\s,.!?:;-]+/, '');
    if(rest) return send(rest);
    armCommand();
    say('Yes sir.');
  }

  /* Talking to server.py */
  function send(text){
    if(busy) return Promise.resolve();
    busy = true; offline = false;
    addMsg('you', text);
    setState('thinking', 'Executing: ' + text);
    startTimer('Running: ' + text);
    updateStopControls();
    currentTyping = addTyping();
    currentAbort = new AbortController();

    return fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
      signal: currentAbort.signal
    })
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error || 'Server error'); return d; }); })
      .then(function(d){
        if(currentTyping){ currentTyping.remove(); currentTyping = null; }
        currentAbort = null;
        stopTimer();
        setConn(true);
        if(d.cancelled){
          addMsg('cancelled', 'Task cancelled, Sir.');
          return;
        }
        d.replies.forEach(function(line){ addMsg('jarvis', line); });
        return say(d.replies.join(' ')).then(function(){
          if(d.shutdown){ offline = true; stopListening(); }
        });
      })
      .catch(function(err){
        if(currentTyping){ currentTyping.remove(); currentTyping = null; }
        currentAbort = null;
        stopTimer();
        if(err && err.name === 'AbortError') return;
        var down = err instanceof TypeError;
        addMsg('error', down ? 'Can’t reach Jarvis server. Check that server.py is running.' : ('Error: ' + err.message));
        setConn(!down);
      })
      .then(function(){
        busy = false;
        stopTimer();
        idle();
        resumeRec();
      });
  }

  function setConn(ok){
    $('conn').className = ok ? 'pill online' : 'pill';
    $('connTxt').textContent = ok ? 'Online' : 'Offline';
  }
  function ping(){
    fetch('/api/health').then(function(r){ return r.json().then(function(d){ setConn(r.ok); if(d && d.provider) updateAiBtn(d.provider, d.ollama_model, d.ollama_ready); }); }).catch(function(){ setConn(false); });
  }
  var aiModes = ['auto', 'ollama', 'gemini'];
  var aiModeIdx = 0;
  function updateAiBtn(p, model, ready){
    var label = p === 'ollama' ? ('AI: Ollama (' + (model || 'llama3.2:3b') + ')')
      : p === 'gemini' ? 'AI: Gemini'
      : ('AI: Auto' + (ready ? ' · Ollama' : ''));
    $('aiMode').textContent = label;
    var i = aiModes.indexOf(p);
    if(i >= 0) aiModeIdx = i;
  }
  $('aiMode').addEventListener('click', function(){
    var next = aiModes[(aiModeIdx + 1) % aiModes.length];
    fetch('/api/provider', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: next })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){ updateAiBtn(d.provider, d.ollama_model, d.ollama_ready); })
      .catch(function(){});
    this.blur();
  });


  /* Controls */
  orb.addEventListener('click', function(){ toggleListening(); orb.blur(); });
  micBtn.addEventListener('click', function(){ toggleListening(); micBtn.blur(); });
  stopTop.addEventListener('click', cancelActiveTask);
  stopInline.addEventListener('click', cancelActiveTask);
  abortBanner.addEventListener('click', cancelActiveTask);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && (busy || speaking)){
      e.preventDefault();
      cancelActiveTask();
      return;
    }
    var tag = document.activeElement && document.activeElement.tagName;
    if(e.code === 'Space' && !e.repeat && tag !== 'INPUT' && tag !== 'BUTTON'){
      e.preventDefault();
      talkNow();
    }
  });

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var t = input.value.trim();
    input.value = '';
    go.disabled = true;
    if(t) send(t);
  });
  input.addEventListener('input', function(){ go.disabled = !input.value.trim(); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !busy && !speaking){ input.value = ''; go.disabled = true; }
  });
  log.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-send')) send(b.dataset.send);
    else if(b.hasAttribute('data-fill')){
      input.value = b.dataset.fill;
      go.disabled = !input.value.trim();
      input.focus();
      if(b.dataset.fill === 'play  in spotify'){ input.setSelectionRange(5, 5); }
    }
  });
  $('mute').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? 'Sound off' : 'Sound on';
    if(muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
  $('micMode').addEventListener('click', function(){
    var was = listening; if(was) stopListening();
    useServer = !useServer;
    try { localStorage.setItem('jarvis-mic', useServer ? 'server' : 'browser'); } catch(_){}
    updateMicLabel();
    if(was) startListening();
    this.blur();
  });
  $('clear').addEventListener('click', showEmpty);

  updateMicLabel();
  showEmpty();
  updateStopControls();
  ping();
  setInterval(ping, 8000);
})();
</script>
</body>
</html>
