<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S — Interactive Touch Command HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04070e;
  --bg-elev: rgba(12, 18, 32, 0.72);
  --surface: rgba(15, 23, 42, 0.74);
  --surface-hi: rgba(28, 41, 66, 0.9);
  --border: rgba(148, 163, 184, 0.16);
  --border-hi: rgba(56, 189, 248, 0.52);
  --cyan: #38bdf8;
  --cyan-soft: rgba(56, 189, 248, 0.18);
  --cyan-glow: rgba(56, 189, 248, 0.42);
  --indigo: #818cf8;
  --emerald: #34d399;
  --amber: #fbbf24;
  --danger: #f43f5e;
  --danger-bg: rgba(244, 63, 94, 0.16);
  --danger-border: rgba(244, 63, 94, 0.52);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --dim: #64748b;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  color-scheme: dark;
  touch-action: manipulation;
}
body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background-color: var(--bg);
  color: var(--text);
  font: 400 14.5px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  background-image:
    radial-gradient(ellipse 80% 48% at 50% -10%, rgba(56, 189, 248, 0.17), transparent 65%),
    radial-gradient(ellipse 55% 45% at 88% 105%, rgba(99, 102, 241, 0.15), transparent 65%),
    linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px;
}

/* Live Interactive Particle Field */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Touch Ripple Layer */
.touch-ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999;
  transform: translate(-50%, -50%) scale(0.15);
  border: 1.5px solid rgba(56, 189, 248, 0.75);
  background: radial-gradient(circle, rgba(56, 189, 248, 0.28), transparent 70%);
  width: 84px;
  height: 84px;
  opacity: 0.9;
  animation: rippleOut 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.top, .stage, .task-banner, .log, .quick-strip, .dock, .toast-wrap {
  position: relative;
  z-index: 2;
}

button, input { font: inherit; color: inherit; }
button {
  cursor: pointer;
  touch-action: manipulation;
  position: relative;
  overflow: hidden;
  transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s ease, background 0.18s ease, box-shadow 0.2s ease, color 0.18s ease;
}
button:active:not(:disabled) {
  transform: scale(0.94);
}
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* Top Navigation Bar */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px;
  background: rgba(4, 7, 14, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(56, 189, 248, 0.45);
  animation: pulse 2.2s ease-in-out infinite;
  flex: none;
}
.brand {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cyan);
  padding: 2px 8px;
  border: 1px solid rgba(56, 189, 248, 0.28);
  background: rgba(56, 189, 248, 0.08);
  border-radius: 999px;
  white-space: nowrap;
}
.telemetry {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.55);
  white-space: nowrap;
}
.telemetry .lat { color: var(--emerald); }

.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
}
#conn i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dim);
  transition: background 0.2s, box-shadow 0.2s;
}
#conn.online i { background: var(--emerald); box-shadow: 0 0 10px var(--emerald); }
#conn.online { color: var(--text); border-color: rgba(52, 211, 153, 0.34); }

.ghost {
  min-height: 36px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--muted);
}
.ghost:hover {
  color: var(--text);
  border-color: var(--border-hi);
  background: var(--surface-hi);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.14);
}
.ghost.active-pill {
  color: var(--cyan);
  border-color: rgba(56, 189, 248, 0.45);
  background: rgba(56, 189, 248, 0.12);
}

.stop-top {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 13px;
  border-radius: 11px;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  color: #fda4af;
  font-size: 12.5px;
  font-weight: 600;
}
.stop-top:hover:not(:disabled) {
  background: var(--danger);
  color: #fff;
  box-shadow: 0 0 22px rgba(244, 63, 94, 0.5);
}
.stop-top:disabled {
  opacity: 0.35;
  cursor: default;
  border-color: var(--border);
  background: transparent;
  color: var(--dim);
}
.stop-top svg { width: 13px; height: 13px; fill: currentColor; }

/* Interactive 3D Arc-Reactor Stage */
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 20px 6px;
  perspective: 700px;
  transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.reactor-wrap {
  position: relative;
  display: grid;
  place-items: center;
  width: 172px;
  height: 172px;
  transform-style: preserve-3d;
  transition: width 0.35s ease, height 0.35s ease, transform 0.18s ease-out;
  touch-action: none;
}
#waveCanvas {
  position: absolute;
  inset: -14px;
  width: calc(100% + 28px);
  height: calc(100% + 28px);
  pointer-events: none;
}
.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(56, 189, 248, 0.24);
  pointer-events: none;
  transition: border-color 0.25s ease, transform 0.25s ease;
}
.ring.r1 {
  inset: 6px;
  border-width: 1.5px;
  border-top-color: var(--cyan);
  border-right-color: transparent;
  animation: spin 10s linear infinite;
}
.ring.r2 {
  inset: 17px;
  border-style: dashed;
  border-color: rgba(129, 140, 248, 0.38);
  animation: spinRev 16s linear infinite;
}
.hold-ring {
  position: absolute;
  inset: 2px;
  width: calc(100% - 4px);
  height: calc(100% - 4px);
  transform: rotate(-90deg);
  pointer-events: none;
}
.hold-ring circle {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 440;
  stroke-dashoffset: 440;
  filter: drop-shadow(0 0 8px var(--cyan));
  transition: stroke-dashoffset 0.06s linear;
}
.orb {
  position: relative;
  width: 112px;
  height: 112px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.32);
  background:
    radial-gradient(circle at var(--gx, 32%) var(--gy, 28%), rgba(224, 242, 254, 0.94), rgba(56, 189, 248, 0.44) 38%, rgba(15, 23, 42, 0.92) 78%),
    radial-gradient(circle at 72% 76%, rgba(99, 102, 241, 0.62), transparent 62%);
  box-shadow:
    inset 0 2px 14px rgba(255, 255, 255, 0.52),
    0 0 42px rgba(56, 189, 248, 0.42),
    0 16px 42px rgba(0, 0, 0, 0.58);
  display: grid;
  place-items: center;
  touch-action: none;
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, width 0.35s ease, height 0.35s ease;
}
.orb:hover {
  transform: scale(1.06);
  box-shadow: inset 0 2px 16px rgba(255, 255, 255, 0.62), 0 0 60px rgba(56, 189, 248, 0.62);
}
.orb.pressing {
  transform: scale(0.92);
  box-shadow: inset 0 2px 20px rgba(255, 255, 255, 0.72), 0 0 70px rgba(56, 189, 248, 0.8);
}
.orb-bars { display: flex; align-items: center; gap: 4.5px; height: 32px; pointer-events: none; }
.orb-bars i {
  display: block;
  width: 3.8px;
  height: 8px;
  border-radius: 99px;
  background: #fff;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
  transition: height 0.14s ease;
}
.orb-bars i:nth-child(2) { animation-delay: -0.15s; }
.orb-bars i:nth-child(3) { animation-delay: -0.3s; }
.orb-bars i:nth-child(4) { animation-delay: -0.45s; }
.orb-bars i:nth-child(5) { animation-delay: -0.6s; }

/* Orb States */
.orb[data-state="listening"] .orb-bars i { height: 12px; }
.orb[data-state="awake"] {
  box-shadow: inset 0 2px 16px rgba(255, 255, 255, 0.7), 0 0 68px rgba(56, 189, 248, 0.78);
}
.orb[data-state="awake"] .orb-bars i,
.orb[data-state="speaking"] .orb-bars i { animation: wave 0.72s ease-in-out infinite; }
.orb[data-state="thinking"] {
  background:
    radial-gradient(circle at var(--gx, 35%) var(--gy, 30%), rgba(221, 214, 254, 0.94), rgba(99, 102, 241, 0.56) 42%, rgba(15, 23, 42, 0.92) 80%);
  box-shadow: 0 0 58px rgba(99, 102, 241, 0.72);
}
.orb[data-state="thinking"] ~ .r1 { animation-duration: 1.8s; border-top-color: #a5b4fc; }
.orb[data-state="thinking"] .orb-bars i { animation: wave 0.48s ease-in-out infinite; }

/* Compact header stage once messages exist */
.has-msgs .stage {
  flex-direction: row;
  justify-content: center;
  gap: 14px;
  padding: 8px 20px 4px;
}
.has-msgs .reactor-wrap { width: 64px; height: 64px; }
.has-msgs .ring.r1 { inset: 2px; }
.has-msgs .ring.r2 { inset: 7px; }
.has-msgs .orb { width: 46px; height: 46px; }
.has-msgs .orb-bars { height: 16px; gap: 2.5px; }
.has-msgs .orb-bars i { width: 2.5px; height: 4px; }
.has-msgs .orb[data-state="awake"] .orb-bars i,
.has-msgs .orb[data-state="speaking"] .orb-bars i,
.has-msgs .orb[data-state="thinking"] .orb-bars i { animation-name: waveSmall; }
.has-msgs .gesture-hint { display: none; }

.txt { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.has-msgs .txt { align-items: flex-start; }
#status {
  margin: 0;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
}
.gesture-hint {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--dim);
}
.heard {
  margin: 0;
  max-width: min(56ch, 88vw);
  min-height: 1.25em;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--cyan);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Active Task Banner (Swipe Left to Cancel on Touch!) */
.task-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: min(760px, calc(100% - 28px));
  margin: 4px auto 0;
  padding: 10px 14px;
  border-radius: 13px;
  background: rgba(244, 63, 94, 0.1);
  border: 1px solid rgba(244, 63, 94, 0.38);
  backdrop-filter: blur(14px);
  touch-action: pan-y;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.task-banner.show { display: flex; }
.task-info {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  font-size: 13px;
  color: var(--text);
}
.pulse-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: pulse 1.1s ease-in-out infinite;
}
.task-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-timer { font-family: var(--font-mono); font-size: 12px; color: var(--muted); flex: none; }
.abort-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 5px 13px;
  border-radius: 9px;
  border: 1px solid var(--danger-border);
  background: var(--danger);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
}
.abort-btn:hover { filter: brightness(1.12); box-shadow: 0 0 16px rgba(244, 63, 94, 0.45); }

/* Conversation Log */
.log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  width: 100%;
  max-width: 790px;
  margin: 0 auto;
  padding: 10px 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: text;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(148, 163, 184, 0.24) transparent;
}
.empty { margin: auto; width: 100%; text-align: center; padding: 4px 0; }
.empty h2 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 29px;
  font-weight: 700;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #ffffff 28%, #7dd3fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.empty p { margin: 0 0 20px; color: var(--muted); font-size: 13.5px; max-width: 54ch; margin-inline: auto; }

.sug {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  max-width: 600px;
  margin: 0 auto;
  text-align: left;
}
.sug button {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 14px 16px;
  min-height: 68px;
  backdrop-filter: blur(14px);
}
.sug button:hover {
  transform: translateY(-2px);
  border-color: var(--border-hi);
  background: var(--surface-hi);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 0 20px rgba(56, 189, 248, 0.14);
}
.sug b { display: block; font-weight: 600; font-size: 13.5px; color: var(--text); margin-bottom: 2px; }
.sug span { font-size: 12.5px; color: var(--muted); }

/* Messages with Interactive Action Chips */
.msg {
  max-width: 68ch;
  overflow-wrap: anywhere;
  animation: fadeUp 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}
.msg.you {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.22));
  border: 1px solid rgba(56, 189, 248, 0.38);
  border-radius: 17px 17px 4px 17px;
  padding: 10px 15px;
  color: #fff;
}
.msg.jarvis {
  align-self: flex-start;
  display: flex;
  gap: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 17px 17px 17px 4px;
  padding: 11px 15px;
  backdrop-filter: blur(14px);
}
.msg.jarvis::before {
  content: "";
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #bae6fd, #38bdf8 50%, #4f46e5);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
}
.msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}
.msg-act {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 9px;
  min-height: 28px;
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  background: rgba(15, 23, 42, 0.55);
  color: var(--muted);
}
.msg-act:hover {
  color: var(--text);
  border-color: var(--border-hi);
  background: rgba(56, 189, 248, 0.14);
}
.msg.cancelled {
  align-self: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #fda4af;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  border-radius: 999px;
  padding: 4px 14px;
}
.msg.error {
  align-self: center;
  color: #fda4af;
  font-size: 13px;
  text-align: center;
  border: 1px solid var(--danger-border);
  background: var(--danger-bg);
  border-radius: 10px;
  padding: 8px 14px;
}

.typing span {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 8px 2px 0;
  border-radius: 50%;
  background: var(--cyan);
  animation: dot 1.05s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

/* Touch-Scrollable Live Quick-Action Strip */
.quick-strip {
  width: 100%;
  max-width: 790px;
  margin: 0 auto;
  padding: 4px 20px 2px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.quick-strip::-webkit-scrollbar { display: none; }
.qchip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: blur(10px);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
}
.qchip:hover {
  color: var(--text);
  border-color: var(--border-hi);
  background: rgba(56, 189, 248, 0.14);
  transform: translateY(-1px);
}
.qchip i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

/* Bottom Composer Dock */
.dock {
  padding: 8px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 72%, transparent);
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 790px;
  margin: 0 auto;
  padding: 7px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  box-shadow: 0 14px 38px rgba(0, 0, 0, 0.48);
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
}
.bar:focus-within {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18), 0 16px 40px rgba(0, 0, 0, 0.55);
}
#text {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  padding: 9px 6px;
  font-size: 15px;
}
#text::placeholder { color: var(--dim); }

.icon, .send, .stop-inline {
  flex: none;
  height: 44px;
  border-radius: 14px;
  border: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon { width: 44px; background: rgba(148, 163, 184, 0.08); color: var(--muted); }
.icon:hover { background: var(--surface-hi); color: var(--text); }
.icon.on {
  background: rgba(56, 189, 248, 0.24);
  color: var(--cyan);
  box-shadow: 0 0 18px rgba(56, 189, 248, 0.36);
}
.send {
  width: 44px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: #fff;
  box-shadow: 0 4px 16px rgba(56, 189, 248, 0.28);
}
.send:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
.send:disabled { opacity: 0.28; cursor: default; box-shadow: none; }

.stop-inline {
  display: none;
  gap: 6px;
  padding: 0 15px;
  background: var(--danger);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 0 18px rgba(244, 63, 94, 0.4);
}
.stop-inline.show { display: inline-flex; }
.stop-inline:hover { filter: brightness(1.1); }

.icon svg, .send svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.stop-inline svg { width: 13px; height: 13px; fill: currentColor; }

/* Floating Interactive Toast */
.toast-wrap {
  position: fixed;
  bottom: 92px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 50;
}
.toast {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid var(--border-hi);
  border-radius: 999px;
  padding: 7px 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 18px rgba(56, 189, 248, 0.25);
  opacity: 0;
  transform: translateY(8px) scale(0.96);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.toast.show { opacity: 1; transform: translateY(0) scale(1); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinRev { to { transform: rotate(-360deg); } }
@keyframes wave { 0%, 100% { height: 7px; } 50% { height: 27px; } }
@keyframes waveSmall { 0%, 100% { height: 4px; } 50% { height: 15px; } }
@keyframes dot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); } 40% { opacity: 1; transform: scale(1.15); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes rippleOut {
  0% { transform: translate(-50%, -50%) scale(0.18); opacity: 0.9; }
  100% { transform: translate(-50%, -50%) scale(1.65); opacity: 0; }
}

@media (max-width: 720px) {
  .top { padding-left: 12px; padding-right: 12px; }
  .brand-sub, .telemetry { display: none; }
  .sug { grid-template-columns: 1fr; }
  .empty h2 { font-size: 24px; }
  .reactor-wrap { width: 148px; height: 148px; }
  .orb { width: 98px; height: 98px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

  <div class="brand-wrap">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1 class="brand">J.A.R.V.I.S</h1>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var orb = $('orb'), reactorWrap = $('reactorWrap'), holdArc = $('holdArc');
  var statusEl = $('status'), heardEl = $('heard'), log = $('log');
  var input = $('text'), go = $('go'), micBtn = $('micBtn');
  var stopTop = $('stopTop'), stopInline = $('stopInline'), taskBanner = $('taskBanner');
  var taskLabel = $('taskLabel'), taskTimer = $('taskTimer'), abortBanner = $('abortBanner');
  var toastEl = $('toast'), clockTxt = $('clockTxt'), latTxt = $('latTxt');

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, awaiting = false, awaitTimer = null, heardTimer = null, sayId = 0;
  var speaking = false, busy = false, muted = false, offline = false;
  var useServer = false, srvActive = false, epoch = 0;
  var currentAbort = null, currentTyping = null, timerInt = null, taskStart = 0;
  var toastTimer = null;
  var cmdHistory = [], histIdx = -1;

  try { useServer = localStorage.getItem('jarvis-mic') === 'server'; } catch(_){}
  try {
    var savedHist = JSON.parse(localStorage.getItem('jarvis-history') || '[]');
    if(Array.isArray(savedHist)) cmdHistory = savedHist.slice(0, 30);
  } catch(_){}

  var WAKE = /(jarvis|jarvas|jervis|jarves|charvis|jarvice|gervais|travis|jarvi)/i;

  /* --- Haptics & Synthesized HUD Micro-Sounds (Web Audio API) --- */
  var audioCtx = null;
  function haptic(pattern){
    try { if(navigator.vibrate) navigator.vibrate(pattern); } catch(_){}
  }
  function beep(freq, dur, type, vol){
    if(muted) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.18, audioCtx.currentTime + (dur || 0.08));
      gain.gain.setValueAtTime(vol || 0.045, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.08));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + (dur || 0.08));
    } catch(_){}
  }
  function sfxTap(){ beep(520, 0.055, 'sine', 0.032); haptic(10); }
  function sfxWake(){ beep(640, 0.09, 'triangle', 0.05); setTimeout(function(){ beep(880, 0.11, 'sine', 0.045); }, 70); haptic([15, 25, 18]); }
  function sfxSend(){ beep(440, 0.07, 'sine', 0.04); haptic(12); }
  function sfxCancel(){ beep(260, 0.13, 'sawtooth', 0.035); haptic([25, 30, 25]); }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  /* --- Touch Ripple Anywhere --- */
  function spawnRipple(x, y, color){
    var el = document.createElement('div');
    el.className = 'touch-ripple';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if(color) el.style.borderColor = color;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 540);
  }

  /* --- Live Interactive Neural Particle Background --- */
  var bgCanvas = $('bgCanvas');
  var bgCtx = bgCanvas.getContext('2d');
  var particles = [];
  var shockwaves = [];
  var pointer = { x: -999, y: -999, active: false };

  function resizeBg(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    bgCanvas.width = Math.floor(window.innerWidth * dpr);
    bgCanvas.height = Math.floor(window.innerHeight * dpr);
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var targetCount = Math.min(72, Math.max(28, Math.floor((window.innerWidth * window.innerHeight) / 18000)));
    while(particles.length < targetCount){
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        r: Math.random() * 1.8 + 1.1
      });
    }
    if(particles.length > targetCount) particles.length = targetCount;
  }
  function pushShockwave(x, y, col){
    shockwaves.push({ x: x, y: y, r: 10, max: 190, alpha: 0.65, color: col || '56, 189, 248' });
  }
  function stateAccentRGB(){
    var st = orb.dataset.state;
    if(st === 'thinking') return '129, 140, 248';
    if(st === 'awake' || st === 'speaking') return '52, 211, 153';
    return '56, 189, 248';
  }

  /* --- Live Reactor Waveform Canvas --- */
  var waveCanvas = $('waveCanvas');
  var waveCtx = waveCanvas.getContext('2d');
  var wavePhase = 0;
  var energyBoost = 0;

  function animateVisuals(){
    var w = window.innerWidth, h = window.innerHeight;
    bgCtx.clearRect(0, 0, w, h);
    var rgb = stateAccentRGB();
    var speedMul = (orb.dataset.state === 'thinking') ? 2.1 : (orb.dataset.state === 'awake' || orb.dataset.state === 'speaking') ? 1.6 : 1.0;

    for(var i = 0; i < particles.length; i++){
      var p = particles[i];
      if(pointer.active){
        var dx = pointer.x - p.x, dy = pointer.y - p.y;
        var dist = Math.hypot(dx, dy);
        if(dist < 170 && dist > 1){
          var pull = (170 - dist) / 170 * 0.08;
          p.vx += (dx / dist) * pull;
          p.vy += (dy / dist) * pull;
        }
      }
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx * speedMul;
      p.y += p.vy * speedMul;
      if(p.x < 0) p.x = w; else if(p.x > w) p.x = 0;
      if(p.y < 0) p.y = h; else if(p.y > h) p.y = 0;

      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      bgCtx.fillStyle = 'rgba(' + rgb + ', 0.55)';
      bgCtx.fill();

      for(var j = i + 1; j < particles.length; j++){
        var q = particles[j];
        var d = Math.hypot(p.x - q.x, p.y - q.y);
        if(d < 115){
          bgCtx.beginPath();
          bgCtx.moveTo(p.x, p.y);
          bgCtx.lineTo(q.x, q.y);
          bgCtx.strokeStyle = 'rgba(' + rgb + ', ' + ((1 - d / 115) * 0.16).toFixed(3) + ')';
          bgCtx.lineWidth = 1;
          bgCtx.stroke();
        }
      }
      if(pointer.active){
        var dp = Math.hypot(p.x - pointer.x, p.y - pointer.y);
        if(dp < 140){
          bgCtx.beginPath();
          bgCtx.moveTo(p.x, p.y);
          bgCtx.lineTo(pointer.x, pointer.y);
          bgCtx.strokeStyle = 'rgba(' + rgb + ', ' + ((1 - dp / 140) * 0.34).toFixed(3) + ')';
          bgCtx.lineWidth = 1.1;
          bgCtx.stroke();
        }
      }
    }

    for(var s = shockwaves.length - 1; s >= 0; s--){
      var sw = shockwaves[s];
      sw.r += 5.5;
      sw.alpha *= 0.93;
      bgCtx.beginPath();
      bgCtx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      bgCtx.strokeStyle = 'rgba(' + sw.color + ', ' + sw.alpha.toFixed(3) + ')';
      bgCtx.lineWidth = 1.6;
      bgCtx.stroke();
      if(sw.r > sw.max || sw.alpha < 0.02) shockwaves.splice(s, 1);
    }

    /* Reactor radial waveform ring */
    wavePhase += (orb.dataset.state === 'thinking' ? 0.12 : orb.dataset.state === 'awake' || orb.dataset.state === 'speaking' ? 0.09 : 0.035);
    energyBoost *= 0.92;
    var cw = waveCanvas.width, ch = waveCanvas.height, cx = cw / 2, cy = ch / 2;
    waveCtx.clearRect(0, 0, cw, ch);
    var baseR = 76;
    var amp = (orb.dataset.state === 'speaking' || orb.dataset.state === 'awake') ? 9 : (orb.dataset.state === 'thinking' ? 7 : 2.5);
    amp += energyBoost * 12;
    waveCtx.beginPath();
    var segs = 64;
    for(var k = 0; k <= segs; k++){
      var ang = (k / segs) * Math.PI * 2;
      var n = Math.sin(ang * 5 + wavePhase) * amp + Math.cos(ang * 9 - wavePhase * 1.4) * (amp * 0.45);
      var rr = baseR + n;
      var px = cx + Math.cos(ang) * rr;
      var py = cy + Math.sin(ang) * rr;
      if(k === 0) waveCtx.moveTo(px, py); else waveCtx.lineTo(px, py);
    }
    waveCtx.closePath();
    waveCtx.strokeStyle = 'rgba(' + rgb + ', 0.55)';
    waveCtx.lineWidth = 2;
    waveCtx.stroke();

    requestAnimationFrame(animateVisuals);
  }

  /* Global pointer/touch tracking for live neural field + ripples */
  window.addEventListener('pointermove', function(e){
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
    /* 3D magnetic tilt on reactor */
    var rect = reactorWrap.getBoundingClientRect();
    var rx = rect.left + rect.width / 2;
    var ry = rect.top + rect.height / 2;
    var dx = (e.clientX - rx) / Math.max(120, window.innerWidth * 0.35);
    var dy = (e.clientY - ry) / Math.max(120, window.innerHeight * 0.35);
    dx = Math.max(-1, Math.min(1, dx));
    dy = Math.max(-1, Math.min(1, dy));
    reactorWrap.style.transform = 'rotateX(' + (-dy * 12).toFixed(1) + 'deg) rotateY(' + (dx * 12).toFixed(1) + 'deg)';
    orb.style.setProperty('--gx', (50 + dx * 24).toFixed(0) + '%');
    orb.style.setProperty('--gy', (50 + dy * 24).toFixed(0) + '%');
  }, { passive: true });

  window.addEventListener('pointerleave', function(){
    pointer.active = false;
    reactorWrap.style.transform = 'rotateX(0deg) rotateY(0deg)';
  });

  document.addEventListener('pointerdown', function(e){
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
    pushShockwave(e.clientX, e.clientY, stateAccentRGB());
    if(e.target.closest('button')){
      spawnRipple(e.clientX, e.clientY);
      energyBoost = Math.min(1.4, energyBoost + 0.55);
    }
  }, { passive: true });

  window.addEventListener('resize', resizeBg);
  resizeBg();
  requestAnimationFrame(animateVisuals);

  /* Live Telemetry Clock */
  function tickClock(){
    var d = new Date();
    clockTxt.textContent = d.toLocaleTimeString([], { hour12: false });
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* --- Core Assistant State Helpers --- */
  function setState(s, msg){ orb.dataset.state = s; if(msg) statusEl.textContent = msg; }
  function updateStopControls(){
    var active = busy || speaking;
    stopTop.disabled = !active;
    stopInline.classList.toggle('show', active);
    go.style.display = active ? 'none' : 'inline-flex';
    taskBanner.classList.toggle('show', active);
    if(!active){ taskBanner.style.transform = ''; taskBanner.style.opacity = ''; }
  }
  function startTimer(label){
    taskStart = performance.now();
    taskLabel.textContent = label;
    taskTimer.textContent = '0.0s';
    clearInterval(timerInt);
    timerInt = setInterval(function(){
      taskTimer.textContent = ((performance.now() - taskStart) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopTimer(){
    clearInterval(timerInt);
    timerInt = null;
  }

  function idle(){
    micBtn.classList.toggle('on', listening);
    updateStopControls();
    if(offline) return setState('idle', 'Jarvis shut down. Send any command to wake it.');
    if(!listening) return setState('idle', 'Tap the core to listen · Hold for instant talk');
    if(awaiting) return setState('awake', 'I’m listening, Sir…');
    setState('listening', 'Say “Jarvis” (or hold core / press Space)');
  }

  function showHeard(t, isFinal){
    heardEl.textContent = t ? ('Heard: “' + t + '”') : '';
    clearTimeout(heardTimer);
    if(isFinal) heardTimer = setTimeout(function(){ heardEl.textContent = ''; }, 4000);
  }

  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ showToast('Copied to clipboard'); }).catch(function(){ fallbackCopy(txt); });
    } else {
      fallbackCopy(txt);
    }
  }
  function fallbackCopy(txt){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('Copied to clipboard');
    } catch(_){ showToast('Copy unavailable'); }
  }

  function showEmpty(){
    document.body.classList.remove('has-msgs');
    log.innerHTML = '';
    log.appendChild($('emptyTpl').content.cloneNode(true));
  }
  function addMsg(who, text){
    var e = $('empty'); if(e) e.remove();
    document.body.classList.add('has-msgs');
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    if(who === 'jarvis'){
      var wrap = document.createElement('div');
      wrap.className = 'msg-body';
      var p = document.createElement('div');
      p.textContent = text;
      wrap.appendChild(p);
      var acts = document.createElement('div');
      acts.className = 'msg-actions';
      var bCopy = document.createElement('button');
      bCopy.type = 'button';
      bCopy.className = 'msg-act';
      bCopy.textContent = 'Copy';
      bCopy.dataset.copy = text;
      var bSpeak = document.createElement('button');
      bSpeak.type = 'button';
      bSpeak.className = 'msg-act';
      bSpeak.textContent = 'Speak';
      bSpeak.dataset.speak = text;
      acts.appendChild(bCopy);
      acts.appendChild(bSpeak);
      wrap.appendChild(acts);
      d.appendChild(wrap);
    } else if(who === 'you'){
      var uWrap = document.createElement('div');
      uWrap.className = 'msg-body';
      var up = document.createElement('div');
      up.textContent = text;
      uWrap.appendChild(up);
      var uActs = document.createElement('div');
      uActs.className = 'msg-actions';
      var bRe = document.createElement('button');
      bRe.type = 'button';
      bRe.className = 'msg-act';
      bRe.textContent = 'Re-run';
      bRe.dataset.send = text;
      uActs.appendChild(bRe);
      uWrap.appendChild(uActs);
      d.appendChild(uWrap);
    } else {
      d.textContent = text;
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function addTyping(){
    var d = document.createElement('div');
    d.className = 'msg jarvis typing';
    d.innerHTML = '<div><span></span><span></span><span></span></div>';
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  /* Stop / Cancel Active Task */
  function cancelActiveTask(){
    if(!busy && !speaking) return;
    sfxCancel();
    energyBoost = 1.2;
    if(currentAbort){ try { currentAbort.abort(); } catch(_){} currentAbort = null; }
    if('speechSynthesis' in window){ try { speechSynthesis.cancel(); } catch(_){} }
    sayId++;
    speaking = false;
    busy = false;
    if(currentTyping){ currentTyping.remove(); currentTyping = null; }
    stopTimer();
    fetch('/api/stop', { method: 'POST' }).catch(function(){});
    addMsg('cancelled', 'Task cancelled, Sir.');
    latTxt.textContent = 'STOPPED';
    showToast('Task cancelled');
    idle();
    resumeRec();
  }

  /* Swipe-left gesture on Active Task Banner to cancel */
  var swipeStartX = 0, swipingBanner = false;
  taskBanner.addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return;
    swipeStartX = e.clientX;
    swipingBanner = true;
  }, { passive: true });
  taskBanner.addEventListener('pointermove', function(e){
    if(!swipingBanner) return;
    var dx = e.clientX - swipeStartX;
    if(dx < 0){
      taskBanner.style.transform = 'translateX(' + Math.max(-140, dx) + 'px)';
      taskBanner.style.opacity = String(Math.max(0.25, 1 + dx / 150));
    }
  }, { passive: true });
  taskBanner.addEventListener('pointerup', function(e){
    if(!swipingBanner) return;
    swipingBanner = false;
    var dx = e.clientX - swipeStartX;
    if(dx < -70){ cancelActiveTask(); }
    else { taskBanner.style.transform = ''; taskBanner.style.opacity = ''; }
  });
  taskBanner.addEventListener('pointercancel', function(){
    swipingBanner = false;
    taskBanner.style.transform = '';
    taskBanner.style.opacity = '';
  });

  /* Speaking */
  function say(text){
    return new Promise(function(done){
      if(muted || !('speechSynthesis' in window) || !text){ done(); return; }
      var id = ++sayId, finished = false, guard;
      function end(){
        if(finished) return;
        finished = true;
        clearTimeout(guard);
        if(id === sayId){ speaking = false; stopTimer(); resumeRec(); idle(); }
        done();
      }
      try {
        if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; u.rate = 1.04;
        u.onend = end; u.onerror = end;
        speaking = true;
        pauseRec();
        startTimer('Speaking response…');
        updateStopControls();
        setState('speaking', 'Speaking…');
        guard = setTimeout(end, Math.max(4000, text.length * 95));
        speechSynthesis.speak(u);
      } catch(_){ end(); }
    });
  }

  /* Listening */
  function pauseRec(){
    if(useServer){ epoch++; return; }
    if(rec && listening){ try { rec.stop(); } catch(_){} }
  }
  function resumeRec(){
    if(!listening) return;
    if(useServer){ serverLoop(); return; }
    if(rec){ try { rec.start(); } catch(_){} }
  }
  function serverLoop(){
    if(!listening || !useServer || srvActive || speaking || busy) return;
    srvActive = true; var my = epoch;
    fetch('/api/listen', { method: 'POST' })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(x){
        srvActive = false;
        if(!x.ok){
          listening = false; awaiting = false; idle();
          statusEl.textContent = x.d.error || 'The computer’s microphone failed.';
          return;
        }
        if(listening && my === epoch && x.d.text){ showHeard(x.d.text, true); heard(x.d.text); }
      })
      .catch(function(){
        srvActive = false; listening = false; awaiting = false; idle();
        statusEl.textContent = 'Can’t reach Jarvis server. Check that server.py is running.';
      })
      .then(function(){ if(listening) setTimeout(serverLoop, 60); });
  }
  function updateMicLabel(){ $('micMode').textContent = useServer ? 'Mic: computer' : 'Mic: browser'; }
  function switchToServer(){
    useServer = true; try { localStorage.setItem('jarvis-mic', 'server'); } catch(_){}
    updateMicLabel();
    try { rec && rec.stop(); } catch(_){}
    idle();
    statusEl.textContent = 'Using this computer’s microphone.';
    serverLoop();
  }
  function startListening(){
    if(useServer){ listening = true; idle(); serverLoop(); return; }
    if(!SR){ setState('idle', 'Voice input needs Chrome or Edge. Typing still works.'); showToast('Voice needs Chrome/Edge'); return; }
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e){
      var interim = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        var t = e.results[i][0].transcript.trim();
        if(e.results[i].isFinal){ showHeard(t, true); heard(t); }
        else interim += t + ' ';
      }
      if(interim) showHeard(interim.trim(), false);
    };
    rec.onend = function(){
      if(listening && !speaking && !useServer) setTimeout(function(){ if(listening && !speaking && !useServer){ try { rec.start(); } catch(_){} } }, 250);
    };
    rec.onerror = function(e){
      var msg = null;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = 'Microphone blocked. Allow it in the address bar.';
      else if(e.error === 'network'){ switchToServer(); return; }
      else if(e.error === 'audio-capture') msg = 'No microphone detected.';
      if(msg){ listening = false; awaiting = false; idle(); statusEl.textContent = msg; }
    };
    listening = true;
    try { rec.start(); } catch(_){}
    idle();
  }
  function stopListening(){
    epoch++; listening = false; awaiting = false; clearTimeout(awaitTimer);
    try { rec && rec.stop(); } catch(_){}
    showHeard('');
    idle();
  }
  function toggleListening(){ sfxTap(); listening ? stopListening() : startListening(); }
  function armCommand(){
    awaiting = true; clearTimeout(awaitTimer);
    sfxWake();
    energyBoost = 1.25;
    setState('awake', 'I’m listening, Sir…');
    awaitTimer = setTimeout(function(){ awaiting = false; idle(); }, 12000);
  }
  function talkNow(){
    if(!SR && !useServer){ setState('idle', 'Voice input needs Chrome or Edge.'); return; }
    if(!listening) startListening();
    if(listening) armCommand();
  }
  function heard(text){
    if(!text || busy || speaking) return;
    if(awaiting){ awaiting = false; clearTimeout(awaitTimer); return send(text); }
    var m = text.match(WAKE); if(!m) return;
    var rest = text.slice(m.index + m[0].length).replace(/^[\s,.!?:;-]+/, '');
    if(rest) return send(rest);
    armCommand();
    say('Yes sir.');
  }

  /* --- Touch-Sensitive Core Gestures (Tap, Long-Press Hold-to-Talk, Double-Tap Pulse) --- */
  var holdTimer = null, holdAnim = null, holdTriggered = false, lastCoreTap = 0;
  var HOLD_MS = 380;

  function resetHoldRing(){
    cancelAnimationFrame(holdAnim);
    clearTimeout(holdTimer);
    orb.classList.remove('pressing');
    holdArc.style.strokeDashoffset = '440';
  }

  orb.addEventListener('pointerdown', function(e){
    e.preventDefault();
    holdTriggered = false;
    orb.classList.add('pressing');
    var start = performance.now();
    function tickHold(){
      var p = Math.min(1, (performance.now() - start) / HOLD_MS);
      holdArc.style.strokeDashoffset = String(440 * (1 - p));
      if(p < 1) holdAnim = requestAnimationFrame(tickHold);
    }
    holdAnim = requestAnimationFrame(tickHold);
    holdTimer = setTimeout(function(){
      holdTriggered = true;
      energyBoost = 1.4;
      var rect = orb.getBoundingClientRect();
      pushShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2, '52, 211, 153');
      talkNow();
      showToast('Hold-to-talk armed');
    }, HOLD_MS);
  });

  orb.addEventListener('pointerup', function(){
    resetHoldRing();
    if(holdTriggered) return;
    var now = Date.now();
    if(now - lastCoreTap < 310){
      lastCoreTap = 0;
      energyBoost = 1.5;
      sfxWake();
      var rect = orb.getBoundingClientRect();
      pushShockwave(rect.left + rect.width / 2, rect.top + rect.height / 2, '56, 189, 248');
      showToast('Core pulse · Systems active');
      ping();
      return;
    }
    lastCoreTap = now;
    toggleListening();
    orb.blur();
  });
  orb.addEventListener('pointercancel', resetHoldRing);
  orb.addEventListener('pointerleave', resetHoldRing);

  /* Hold-to-talk on mic button too */
  var micHoldTimer = null, micHeld = false;
  micBtn.addEventListener('pointerdown', function(){
    micHeld = false;
    micHoldTimer = setTimeout(function(){
      micHeld = true;
      talkNow();
      showToast('Instant voice armed');
    }, 380);
  });
  micBtn.addEventListener('pointerup', function(){
    clearTimeout(micHoldTimer);
    if(!micHeld) toggleListening();
    micBtn.blur();
  });
  micBtn.addEventListener('pointercancel', function(){ clearTimeout(micHoldTimer); });
  micBtn.addEventListener('pointerleave', function(){ clearTimeout(micHoldTimer); });

  /* Talking to server.py */
  function saveHistory(text){
    cmdHistory = [text].concat(cmdHistory.filter(function(x){ return x !== text; })).slice(0, 30);
    histIdx = -1;
    try { localStorage.setItem('jarvis-history', JSON.stringify(cmdHistory)); } catch(_){}
  }

  function send(text){
    if(busy) return Promise.resolve();
    busy = true; offline = false;
    saveHistory(text);
    sfxSend();
    energyBoost = 1.1;
    addMsg('you', text);
    setState('thinking', 'Executing: ' + text);
    startTimer('Running: ' + text);
    updateStopControls();
    currentTyping = addTyping();
    currentAbort = new AbortController();
    var reqT0 = performance.now();

    return fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text }),
      signal: currentAbort.signal
    })
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error || 'Server error'); return d; }); })
      .then(function(d){
        if(currentTyping){ currentTyping.remove(); currentTyping = null; }
        currentAbort = null;
        stopTimer();
        setConn(true);
        latTxt.textContent = Math.round(performance.now() - reqT0) + 'ms';
        if(d.cancelled){
          addMsg('cancelled', 'Task cancelled, Sir.');
          return;
        }
        d.replies.forEach(function(line){ addMsg('jarvis', line); });
        return say(d.replies.join(' ')).then(function(){
          if(d.shutdown){ offline = true; stopListening(); }
        });
      })
      .catch(function(err){
        if(currentTyping){ currentTyping.remove(); currentTyping = null; }
        currentAbort = null;
        stopTimer();
        if(err && err.name === 'AbortError') return;
        var down = err instanceof TypeError;
        latTxt.textContent = down ? 'OFFLINE' : 'ERR';
        addMsg('error', down ? 'Can’t reach Jarvis server. Check that server.py is running.' : ('Error: ' + err.message));
        setConn(!down);
      })
      .then(function(){
        busy = false;
        stopTimer();
        idle();
        resumeRec();
      });
  }

  function setConn(ok){
    $('conn').className = ok ? 'pill online' : 'pill';
    $('connTxt').textContent = ok ? 'Online' : 'Offline';
  }
  function ping(){
    fetch('/api/health').then(function(r){ return r.json().then(function(d){ setConn(r.ok); if(d && d.provider) updateAiBtn(d.provider, d.ollama_model, d.ollama_ready); }); }).catch(function(){ setConn(false); });
  }
  var aiModes = ['auto', 'ollama', 'gemini'];
  var aiModeIdx = 0;
  function updateAiBtn(p, model, ready){
    var label = p === 'ollama' ? ('AI: Ollama (' + (model || 'llama3.2:3b') + ')')
      : p === 'gemini' ? 'AI: Gemini'
      : ('AI: Auto' + (ready ? ' · Ollama' : ''));
    $('aiMode').textContent = label;
    $('aiMode').classList.toggle('active-pill', p === 'ollama' || ready);
    var i = aiModes.indexOf(p);
    if(i >= 0) aiModeIdx = i;
  }
  $('aiMode').addEventListener('click', function(){
    sfxTap();
    var next = aiModes[(aiModeIdx + 1) % aiModes.length];
    updateAiBtn(next, 'llama3.2:3b', false);
    showToast('AI mode → ' + next.toUpperCase());
    fetch('/api/provider', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: next })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){ updateAiBtn(d.provider, d.ollama_model, d.ollama_ready); })
      .catch(function(){});
    this.blur();
  });

  /* Controls */
  stopTop.addEventListener('click', cancelActiveTask);
  stopInline.addEventListener('click', cancelActiveTask);
  abortBanner.addEventListener('click', cancelActiveTask);

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && (busy || speaking)){
      e.preventDefault();
      cancelActiveTask();
      return;
    }
    var tag = document.activeElement && document.activeElement.tagName;
    if(e.code === 'Space' && !e.repeat && tag !== 'INPUT' && tag !== 'BUTTON'){
      e.preventDefault();
      talkNow();
    }
  });

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var t = input.value.trim();
    input.value = '';
    go.disabled = true;
    if(t) send(t);
  });
  input.addEventListener('input', function(){ go.disabled = !input.value.trim(); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !busy && !speaking){ input.value = ''; go.disabled = true; return; }
    if(e.key === 'ArrowUp' && cmdHistory.length){
      e.preventDefault();
      histIdx = Math.min(cmdHistory.length - 1, histIdx + 1);
      input.value = cmdHistory[histIdx];
      go.disabled = !input.value.trim();
    } else if(e.key === 'ArrowDown' && histIdx >= 0){
      e.preventDefault();
      histIdx--;
      input.value = histIdx >= 0 ? cmdHistory[histIdx] : '';
      go.disabled = !input.value.trim();
    }
  });

  function handleActionButton(b){
    if(!b) return;
    if(b.hasAttribute('data-send')){ sfxTap(); send(b.dataset.send); }
    else if(b.hasAttribute('data-fill')){
      sfxTap();
      input.value = b.dataset.fill;
      go.disabled = !input.value.trim();
      input.focus();
      if(b.dataset.fill === 'play  in spotify'){ input.setSelectionRange(5, 5); }
    } else if(b.hasAttribute('data-copy')){
      sfxTap();
      copyText(b.dataset.copy);
    } else if(b.hasAttribute('data-speak')){
      sfxTap();
      say(b.dataset.speak);
    }
  }

  log.addEventListener('click', function(e){ handleActionButton(e.target.closest('button')); });
  $('quickStrip').addEventListener('click', function(e){ handleActionButton(e.target.closest('button')); });

  $('mute').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? 'Sound off' : 'Sound on';
    showToast(muted ? 'Audio muted' : 'Audio enabled');
    if(!muted) sfxTap();
    if(muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  });
  $('micMode').addEventListener('click', function(){
    sfxTap();
    var was = listening; if(was) stopListening();
    useServer = !useServer;
    try { localStorage.setItem('jarvis-mic', useServer ? 'server' : 'browser'); } catch(_){}
    updateMicLabel();
    showToast('Mic switched to ' + (useServer ? 'computer' : 'browser'));
    if(was) startListening();
    this.blur();
  });
  $('clear').addEventListener('click', function(){ sfxTap(); showEmpty(); showToast('Console cleared'); });

  updateMicLabel();
  showEmpty();
  updateStopControls();
  ping();
  setInterval(ping, 8000);
})();
</script>
</body>
</html>
